[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-journey"
version = "0.1.0"
description = "Bridge between TauricResearch/TradingAgents and the official TradingView MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git",
    "mcp>=1.9",
    "langchain-mcp-adapters>=0.1",
    "langchain-anthropic>=0.3",
    "langgraph>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trading-journey = "trading_journey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
