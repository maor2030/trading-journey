[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-journey"
version = "0.1.0"
description = "Autonomous long-only paper-trading agent driven by TradingAgents, executing via TradingView MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git",
    "mcp>=1.9",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "pandas>=2.0",
    "exchange_calendars>=4.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trading-journey = "trading_journey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
